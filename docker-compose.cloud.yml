version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mad-professor-api
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "8000:8000"
    command: ["python", "server.py"]
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: mad-professor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: mad-professor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mad_professor}
      POSTGRES_USER: ${POSTGRES_USER:-mad_professor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mad_professor_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
